version: 2
updates:
  # Minor and patch updates are grouped in one pull request per ecosystem (and auto-merged once CI
  # passes, see .github/workflows/dependabot-auto-merge.yml). Major updates stay separate pull requests.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  # The three Maven backends in one entry: Spring Boot, springdoc... give a single pull request.
  - package-ecosystem: "maven"
    directories:
      - "/antares-auth"
      - "/aldebaran-training"
      - "/bellatrix-swagger"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The alpha Logback appender must follow the OpenTelemetry SDK managed by Spring Boot and
      # breaks when bumped alone. Removing the appender is a later lot.
      - dependency-name: "io.opentelemetry.instrumentation:*"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/sirius-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  # Observability images in docker-compose.observability.yml and base images: monthly.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "docker"
    directories:
      - "/antares-auth"
      - "/aldebaran-training"
      - "/bellatrix-swagger"
      - "/sirius-app"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
