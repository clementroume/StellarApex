<div class="container mx-auto pb-12">
  <div class="mt-8 mb-6 text-center md:text-left">
    <h1 class="text-3xl font-bold">{{ 'MUSCLE.TITLE' | translate }}</h1>
  </div>

  <app-search-input
    [placeholder]="'MUSCLE.ACTIONS.SEARCH' | translate"
    [value]="searchQuery()"
    (valueChange)="onSearchChange($event)">
  </app-search-input>

  <app-list-state
    [isLoading]="isLoading()"
    [isRawEmpty]="rawMuscles().length === 0"
    [isFilteredEmpty]="filteredMuscles().length === 0"
    [emptyMessage]="'MUSCLE.MESSAGES.EMPTY_LIST' | translate"
    [emptySearchMessage]="'MUSCLE.MESSAGES.EMPTY_LIST_SEARCH' | translate: {name: searchQuery()}">

    @if (isSearching()) {
      <div class="px-2 sm:px-0">
        <ng-container [ngTemplateOutlet]="rows"/>
      </div>
    } @else {
      <div class="flex flex-wrap gap-2 mb-4 px-2 sm:px-0" role="group" data-slot="regions"
           [attr.aria-label]="'MUSCLE.FIELDS.GROUP' | translate">
        @for (region of muscleGroupKeys(); track region) {
          <button hlmBtn variant="outline" size="sm" type="button" class="rounded-full aria-pressed:border-secondary aria-pressed:bg-secondary/15"
                  [attr.aria-pressed]="activeRegion() === region" (click)="activeRegion.set(region)">
            {{ 'MUSCLE.GROUPS.' + region | translate }}
          </button>
        }
      </div>
      <div class="explorer px-2 sm:px-0">
        <div class="rounded-xl border bg-card p-3">
          <app-body-map [selected]="activeRegion()" (regionPicked)="activeRegion.set($event)"/>
        </div>
        <ng-container [ngTemplateOutlet]="rows"/>
      </div>
    }

    <ng-template #rows>
      <ul class="flex flex-col gap-1 list-none p-0" data-slot="muscle-rows">
        @for (row of shownRows(); track row.muscle.id) {
          <app-list-item
            [class]="row.isMember ? 'block pl-8 border-l-4 border-muted' : 'block'"
            [title]="getLocalizedName(row.muscle) || row.muscle.medicalName"
            [subtitle]="getLocalizedName(row.muscle) !== row.muscle.medicalName ? row.muscle.medicalName : undefined"
            [badge]="groupBadge(row.muscle)"
            [imageUrl]="row.muscle.imageUrl"
            [link]="['/muscles', row.muscle.id]">
          </app-list-item>
        }
      </ul>
    </ng-template>
  </app-list-state>

  @if (isAdmin()) {
    <div class="pt-8 flex flex-col md:flex-row justify-end gap-4">
      <button hlmBtn variant="outline" size="lg" class="min-w-36" (click)="exportCsv()" [disabled]="isExporting()">
        <ng-icon name="heroDocumentArrowDown" aria-hidden="true"></ng-icon>
        {{ isExporting() ? '...' : ('EXPORT.EXPORT_CSV' | translate) }}
      </button>

      <a hlmBtn size="lg" routerLink="/muscles/new" class="min-w-36">
        <ng-icon name="heroPlus" aria-hidden="true"></ng-icon>
        {{ 'MUSCLE.ACTIONS.ADD' | translate }}
      </a>
    </div>
  }
</div>
