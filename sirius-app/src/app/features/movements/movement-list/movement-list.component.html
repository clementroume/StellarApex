<div class="container mx-auto pb-12">
  <div class="mt-8 mb-6 text-center md:text-left">
    <h1 class="text-3xl font-bold">{{ 'MOVEMENT.TITLE' | translate }}</h1>
  </div>

  <app-search-input
    [placeholder]="'MOVEMENT.ACTIONS.SEARCH' | translate"
    [value]="searchQuery()"
    (valueChange)="onSearchChange($event)">
  </app-search-input>

  <app-list-state
    [isLoading]="isLoading()"
    [isRawEmpty]="rawMovements().length === 0"
    [isFilteredEmpty]="filteredMovements().length === 0"
    [emptyMessage]="'MOVEMENT.MESSAGES.EMPTY_LIST' | translate"
    [emptySearchMessage]="'MOVEMENT.MESSAGES.EMPTY_LIST_SEARCH' | translate: {name: searchQuery()}">

    <div class="flex justify-center mb-10 w-full px-2 sm:px-0">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 w-full max-w-4xl" role="group"
           [attr.aria-label]="'MOVEMENT.FIELDS.MODALITY' | translate">
        @for (modality of modalityKeys(); track modality) {
          <button hlmBtn variant="outline" type="button"
                  class="h-11 w-full gap-2 aria-pressed:border-secondary aria-pressed:text-secondary aria-pressed:bg-secondary/10"
                  [attr.aria-pressed]="activeTab() === modality" (click)="activeTab.set(modality)">
            <ng-icon [name]="getModalityIcon(modality)" size="1.5rem" aria-hidden="true"></ng-icon>
            <span class="truncate text-sm">{{ 'MOVEMENT.MODALITIES.' + modality | translate }}</span>
          </button>
        }
      </div>
    </div>

    <app-list-grid [items]="populatedCategories()">

      <ng-template let-category>
        <app-list-group [title]="'MOVEMENT.CATEGORIES.' + category | translate"
                        [count]="movementsByCategory().get(category)?.length ?? 0"
                        [expanded]="expandedCategories().has(category)" (expandedChange)="onCategoryToggle(category, $event)">
          @for (movement of movementsByCategory().get(category); track movement.id) {
            <app-list-item
              [title]="movement.name"
              [badge]="movement.nameAbbreviation"
              [imageUrl]="movement.imageUrl"
              [link]="['/movements', movement.id]">
            </app-list-item>
          }
        </app-list-group>
      </ng-template>

    </app-list-grid>
  </app-list-state>

  @if (isAdmin()) {
    <div class="pt-8 flex flex-col md:flex-row justify-end gap-4">
      <button hlmBtn variant="outline" size="lg" class="min-w-36" (click)="exportCsv()" [disabled]="isExporting()">
        <ng-icon name="heroDocumentArrowDown" aria-hidden="true"></ng-icon>
        {{ isExporting() ? '...' : ('EXPORT.EXPORT_CSV' | translate) }}
      </button>

      <a hlmBtn size="lg" routerLink="/movements/new" class="min-w-36">
        <ng-icon name="heroPlus" aria-hidden="true"></ng-icon>
        {{ 'MOVEMENT.ACTIONS.ADD' | translate }}
      </a>
    </div>
  }
</div>
