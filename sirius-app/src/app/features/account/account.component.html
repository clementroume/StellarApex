<div class="p-4 sm:p-8">
  <h1 class="text-3xl md:text-4xl font-bold mb-6 md:mb-8 max-w-5xl mx-auto">{{ 'ACCOUNT.TITLE' | translate }}</h1>
  <div class="flex flex-col md:flex-row gap-6 md:gap-8 max-w-5xl mx-auto">
    <nav class="md:w-1/4" [attr.aria-label]="'ACCOUNT.TITLE' | translate">
      <ul class="flex md:flex-col gap-1 p-1 bg-card border rounded-xl">
        @for (item of menu; track item.link) {
          <li class="flex-1 md:flex-none">
            <a [routerLink]="item.link" routerLinkActive="bg-muted text-foreground font-semibold"
               ariaCurrentWhenActive="page"
               class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-2 h-14 md:h-11
                      px-2 md:px-3 rounded-lg text-xs md:text-sm text-center
                      text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
              <ng-icon [name]="item.icon" size="1.25rem" aria-hidden="true"/>
              {{ item.label | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <main class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
