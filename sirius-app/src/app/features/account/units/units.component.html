<section hlmCard>
  <div hlmCardHeader>
    <h2 hlmCardTitle class="text-xl">{{ 'UNITS.TITLE' | translate }}</h2>
    <p hlmCardDescription>{{ 'UNITS.SUBTITLE' | translate }}</p>
  </div>
  <div hlmCardContent>
    <fieldset class="flex flex-col gap-3">
      <legend class="text-sm font-medium mb-2">{{ 'UNITS.SYSTEM_LABEL' | translate }}</legend>
      @for (system of systems; track system) {
        <label class="flex items-start gap-3 p-4 rounded-lg border cursor-pointer transition-colors hover:bg-muted/50
                      has-checked:border-primary has-checked:bg-primary/5 has-focus-visible:ring-2 has-focus-visible:ring-ring">
          <input type="radio" name="unitSystem" class="mt-1 size-4 accent-(--color-primary)" [id]="'unit-' + system"
                 [value]="system" [checked]="unitService.unitSystem() === system" (change)="select(system)">
          <span class="flex flex-col gap-1">
            <span class="font-semibold flex items-center gap-2">
              <ng-icon name="heroScale" class="text-accent" aria-hidden="true"/>
              {{ 'UNITS.' + system | translate }}
            </span>
            <span class="text-sm text-muted-foreground">{{ 'UNITS.' + system + '_EXAMPLE' | translate }}</span>
          </span>
        </label>
      }
    </fieldset>
  </div>
</section>
