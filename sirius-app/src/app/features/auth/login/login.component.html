<div class="w-full max-w-4xl flex flex-col lg:flex-row-reverse items-center gap-8 lg:gap-16">
  <div class="text-center lg:text-left lg:flex-1">
    <h1 class="text-4xl md:text-5xl font-bold">{{ 'LOGIN.TITLE' | translate }}</h1>
    <p class="pt-4 text-muted-foreground">{{ 'LOGIN.SUBTITLE' | translate }}</p>
  </div>

  <section hlmCard class="w-full max-w-sm">
    <form hlmCardContent class="flex flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <app-form-field for="login-email" icon="heroEnvelope" [label]="'GLOBAL.EMAIL' | translate"
                      [error]="invalid('email') ? ('GLOBAL.ERROR_EMAIL' | translate) : null">
        <input hlmInputGroupInput id="login-email" formControlName="email" type="email" autocomplete="email"
               aria-describedby="login-email-message" [attr.aria-invalid]="invalid('email')" required/>
      </app-form-field>

      <app-form-field for="login-password" icon="heroKey" [label]="'GLOBAL.PASSWORD' | translate">
        <input hlmInputGroupInput id="login-password" formControlName="password" type="password"
               autocomplete="current-password" required/>
      </app-form-field>

      <button hlmBtn size="lg" class="h-11 mt-2" type="submit" [disabled]="loginForm.invalid">
        {{ 'LOGIN.SIGN_IN' | translate }}
      </button>

      <a hlmBtn variant="link" class="self-start px-0" routerLink="/auth/register"
         [queryParams]="forwardReturnUrl ? {returnUrl: forwardReturnUrl} : {}">{{ 'LOGIN.NO_ACCOUNT' | translate }}</a>
    </form>
  </section>
</div>
