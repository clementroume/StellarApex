<div class="w-full max-w-4xl flex flex-col lg:flex-row-reverse items-center gap-8 lg:gap-16">
  <div class="text-center lg:text-left lg:flex-1">
    <h1 class="text-4xl md:text-5xl font-bold">{{ 'RESET_PASSWORD.TITLE' | translate }}</h1>
    <p class="pt-4 text-muted-foreground">{{ 'RESET_PASSWORD.SUBTITLE' | translate }}</p>
  </div>

  <section hlmCard class="w-full max-w-sm">
    @if (token()) {
      <form hlmCardContent class="flex flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="form">
        <app-form-field for="reset-password" icon="heroKey" [label]="'RESET_PASSWORD.NEW_PASSWORD' | translate"
                        [hint]="'GLOBAL.ERROR_PASSWORD_RULES' | translate"
                        [error]="invalid('password') ? ('GLOBAL.ERROR_PASSWORD_RULES' | translate) : null">
          <input hlmInputGroupInput id="reset-password" formControlName="password" type="password"
                 autocomplete="new-password" aria-describedby="reset-password-message"
                 [attr.aria-invalid]="invalid('password')" required/>
        </app-form-field>

        <app-form-field for="reset-confirmation" icon="heroKey" [label]="'GLOBAL.CONFIRM_PASSWORD' | translate"
                        [error]="passwordsMismatch() ? ('GLOBAL.PASSWORDS_MISMATCH' | translate) : null">
          <input hlmInputGroupInput id="reset-confirmation" formControlName="confirmationPassword" type="password"
                 autocomplete="new-password" aria-describedby="reset-confirmation-message"
                 [attr.aria-invalid]="passwordsMismatch()" required/>
        </app-form-field>

        <p class="text-sm text-muted-foreground">{{ 'RESET_PASSWORD.SIGN_OUT_HINT' | translate }}</p>

        <button hlmBtn size="lg" class="h-11" type="submit" [disabled]="form.invalid || saving()">
          {{ 'RESET_PASSWORD.SUBMIT' | translate }}
        </button>
      </form>
    } @else {
      <div hlmCardContent class="flex flex-col gap-4" role="alert">
        <p class="flex items-start gap-2">
          <span class="text-destructive shrink-0 inline-flex" aria-hidden="true"><ng-icon name="heroExclamationTriangle" size="1.5rem"/></span>
          {{ 'RESET_PASSWORD.INVALID_LINK' | translate }}
        </p>
        <a hlmBtn size="lg" class="h-11" routerLink="/auth/forgot-password">{{ 'RESET_PASSWORD.NEW_LINK' | translate }}</a>
      </div>
    }
  </section>
</div>
