<div class="w-full max-w-4xl flex flex-col lg:flex-row-reverse items-center gap-8 lg:gap-16">
  <div class="text-center lg:text-left lg:flex-1">
    <h1 class="text-4xl md:text-5xl font-bold">{{ 'REGISTER.TITLE' | translate }}</h1>
    <p class="pt-4 text-muted-foreground">{{ 'REGISTER.SUBTITLE' | translate }}</p>
  </div>

  <section hlmCard class="w-full max-w-sm">
    <form hlmCardContent class="flex flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="registerForm">
      <app-form-field for="register-first-name" icon="heroUser" [label]="'GLOBAL.FIRST_NAME' | translate"
                      [error]="invalid('firstName') ? ('GLOBAL.REQUIRED' | translate) : null">
        <input hlmInputGroupInput id="register-first-name" formControlName="firstName" type="text" maxlength="50"
               autocomplete="given-name" aria-describedby="register-first-name-message"
               [placeholder]="'GLOBAL.FIRST_NAME_PH' | translate" [attr.aria-invalid]="invalid('firstName')" required/>
      </app-form-field>

      <app-form-field for="register-last-name" icon="heroUser" [label]="'GLOBAL.LAST_NAME' | translate"
                      [error]="invalid('lastName') ? ('GLOBAL.REQUIRED' | translate) : null">
        <input hlmInputGroupInput id="register-last-name" formControlName="lastName" type="text" maxlength="50"
               autocomplete="family-name" aria-describedby="register-last-name-message"
               [placeholder]="'GLOBAL.LAST_NAME_PH' | translate" [attr.aria-invalid]="invalid('lastName')" required/>
      </app-form-field>

      <app-form-field for="register-email" icon="heroEnvelope" [label]="'GLOBAL.EMAIL' | translate"
                      [error]="invalid('email') ? ('GLOBAL.ERROR_EMAIL' | translate) : null">
        <input hlmInputGroupInput id="register-email" formControlName="email" type="email" autocomplete="email"
               aria-describedby="register-email-message" [attr.aria-invalid]="invalid('email')" required/>
      </app-form-field>

      <app-form-field for="register-password" icon="heroKey" [label]="'GLOBAL.PASSWORD' | translate"
                      [hint]="'GLOBAL.ERROR_PASSWORD_RULES' | translate"
                      [error]="invalid('password') ? ('GLOBAL.ERROR_PASSWORD_RULES' | translate) : null">
        <input hlmInputGroupInput id="register-password" formControlName="password" type="password"
               autocomplete="new-password" aria-describedby="register-password-message"
               [attr.aria-invalid]="invalid('password')" required/>
      </app-form-field>

      <app-form-field for="register-confirmation" icon="heroKey" [label]="'GLOBAL.CONFIRM_PASSWORD' | translate"
                      [error]="passwordsMismatch() ? ('GLOBAL.PASSWORDS_MISMATCH' | translate) : null">
        <input hlmInputGroupInput id="register-confirmation" formControlName="confirmationPassword" type="password"
               autocomplete="new-password" aria-describedby="register-confirmation-message"
               [attr.aria-invalid]="passwordsMismatch()" required/>
      </app-form-field>

      <button hlmBtn size="lg" class="h-11 mt-2" type="submit" [disabled]="registerForm.invalid">
        {{ 'REGISTER.SIGN_UP' | translate }}
      </button>

      <a hlmBtn variant="link" class="self-start px-0" routerLink="/auth/login"
         [queryParams]="forwardReturnUrl ? {returnUrl: forwardReturnUrl} : {}">{{ 'REGISTER.HAVE_ACCOUNT' | translate }}</a>
    </form>
  </section>
</div>
