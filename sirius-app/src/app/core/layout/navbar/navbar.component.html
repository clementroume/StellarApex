<header class="sticky top-0 z-40 bg-card/95 backdrop-blur border-b supports-[backdrop-filter]:bg-card/80">
  <div class="mx-auto flex h-14 max-w-7xl items-center gap-2 px-3 md:px-6">
    <a routerLink="/today" class="text-lg md:text-xl font-bold tracking-tight shrink-0">StellarApex</a>

    <!-- Spaces (desktop); mobile uses the bottom tab bar -->
    <nav class="hidden md:flex items-center gap-1 ml-4" [attr.aria-label]="'NAVBAR.SPACES.LABEL' | translate">
      @for (space of spacesService.spaces(); track space.key) {
        <a [routerLink]="space.link"
           class="flex items-center gap-2 h-9 px-3 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors"
           [class.bg-muted]="spacesService.current()?.key === space.key"
           [class.text-foreground]="spacesService.current()?.key === space.key"
           [attr.aria-current]="spacesService.current()?.key === space.key ? 'page' : null">
          <ng-icon [name]="space.icon" size="1.1rem" aria-hidden="true"/>
          {{ space.label | translate }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-1">
      @if (displayGym.hasChoice()) {
        <app-gym-selector [value]="displayGym.gymId()" (valueChange)="displayGym.select($event)"/>
      }

      <button hlmBtn variant="ghost" size="icon" id="theme-toggle" type="button" (click)="themeService.toggleTheme()"
              [attr.aria-label]="'NAVBAR.TOGGLE_THEME' | translate" [attr.aria-pressed]="themeService.currentTheme() === 'dark'">
        <ng-icon [name]="themeService.currentTheme() === 'dark' ? 'heroSun' : 'heroMoon'" size="1.25rem" class="text-accent"
                 aria-hidden="true"/>
      </button>

      <a hlmBtn variant="ghost" size="icon" routerLink="/my-account" routerLinkActive="bg-muted"
         [attr.aria-label]="'NAVBAR.MY_ACCOUNT' | translate">
        <ng-icon name="heroUser" size="1.25rem" aria-hidden="true"/>
      </a>

      <button hlmBtn variant="ghost" size="icon" type="button" class="text-destructive hover:text-destructive"
              (click)="logout()" [attr.aria-label]="'NAVBAR.LOG_OUT' | translate">
        <ng-icon name="heroArrowRightOnRectangle" size="1.25rem" aria-hidden="true"/>
      </button>
    </div>
  </div>
</header>
