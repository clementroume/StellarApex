# ===================================================================
# Antares Auth Properties
# ===================================================================
# === Core Configuration ===
spring.application.name=antares-auth
spring.output.ansi.enabled=always
spring.mvc.problemdetails.enabled=true
# === Database (PostgreSQL) ===
spring.datasource.url=jdbc:postgresql://castor-db:5432/${CASTOR_DB}
spring.datasource.username=${CASTOR_USERNAME}
spring.datasource.password=${CASTOR_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=antares
spring.flyway.default-schema=antares
# === Cache (Redis) ===
spring.data.redis.host=pollux-cache
spring.data.redis.port=6379
spring.data.redis.password=${POLLUX_PASSWORD}
application.cache.default-ttl=600000
application.cache.users-ttl=300000
application.security.login.max-attempts=5
application.security.login.lock-duration=900000
# Wrong enrollment codes: at most 5 per user in a sliding 15-minute window
application.security.enrollment.max-failures=5
application.security.enrollment.window=PT15M
# Registrations: at most 10 per client IP in a sliding hour (every attempt counts)
application.security.registration.max-per-ip=10
application.security.registration.window=PT1H
# Password reset: link valid 30 min; 5 requests per client IP and (silently) 3 mails per address per hour
application.security.password-reset.token-validity=PT30M
application.security.password-reset.max-per-ip=5
application.security.password-reset.max-per-email=3
application.security.password-reset.window=PT1H
# E-mail verification: link valid 48 h; 3 resends per user per hour
application.security.email-verification.token-validity=PT48H
application.security.email-verification.max-resends=3
application.security.email-verification.window=PT1H
# === Mail (generic SMTP; defaults target the local Mailpit container) ===
spring.mail.host=${MAIL_HOST:deneb-mail}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
application.mail.from=${MAIL_FROM:StellarApex <no-reply@stellar.apex>}
# An SMTP outage must not mark Antares down (mails are best effort, sent asynchronously)
management.health.mail.enabled=false
# Thymeleaf only renders mail templates (no MVC views)
spring.thymeleaf.check-template-location=false
# === Security (JWT & Cookies) ===
application.security.jwt.secret-key=${ANTARES_JWT_SECRET}
application.security.jwt.issuer=antares-auth
application.security.jwt.audience=sirius-app
application.security.jwt.access-token.name=stellar_access_token
application.security.jwt.access-token.expiration=900000
application.security.jwt.refresh-token.name=stellar_refresh_token
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.cookie.secure=true
application.security.jwt.cookie.domain=${COOKIE_DOMAIN}
application.security.internal-secret=${INTERNAL_SECRET}
cors.allowed-origins=https://stellar.apex,https://*.stellar.apex
# === Application Features ===
application.admin.default-firstname=${ADMIN_FIRSTNAME}
application.admin.default-lastname=${ADMIN_LASTNAME}
application.admin.default-email=${ADMIN_EMAIL}
application.admin.default-password=${ADMIN_PASSWORD}
application.frontend.url=https://stellar.apex
application.frontend.login.url=https://stellar.apex/auth/login
# === Tracing ===
management.otlp.metrics.export.enabled=false
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
# management.tracing.sampling.probability=1.0
# management.otlp.metrics.export.url=http://vega-alloy:4318/v1/metrics
# management.opentelemetry.tracing.export.otlp.endpoint=http://vega-alloy:4318/v1/traces
# management.opentelemetry.logging.export.otlp.endpoint=http://vega-alloy:4318/v1/logs
# === Springdoc OpenAPI Configuration ===
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/antares-docs
springdoc.swagger-ui.enabled=false