<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">Subject</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
             style="max-width:520px;background:#ffffff;border-radius:8px;padding:32px;">
        <tr><td style="font-size:20px;font-weight:bold;padding-bottom:16px;">StellarApex</td></tr>
        <tr><td style="font-size:16px;padding-bottom:12px;" th:text="${greeting}">Hello,</td></tr>
        <tr><td style="font-size:16px;line-height:1.5;padding-bottom:24px;" th:text="${intro}">Intro</td></tr>
        <tr>
          <td style="padding-bottom:24px;">
            <a th:href="${link}" th:text="${action}"
               style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px;">Action</a>
          </td>
        </tr>
        <tr><td style="font-size:14px;color:#52606d;padding-bottom:8px;" th:text="${expiry}">Expiry</td></tr>
        <tr><td style="font-size:14px;color:#52606d;padding-bottom:24px;" th:text="${ignore}">Ignore</td></tr>
        <tr><td style="font-size:12px;color:#7b8794;padding-bottom:4px;" th:text="${fallback}">Fallback</td></tr>
        <tr><td style="font-size:12px;color:#7b8794;word-break:break-all;padding-bottom:24px;" th:text="${link}">Link</td></tr>
        <tr><td style="font-size:14px;" th:text="${signature}">Signature</td></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
